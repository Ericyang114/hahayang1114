<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>同仁版物件報表｜同仁版物件報表</title>
<style>
*{box-sizing:border-box}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;margin:0;color:#1d2330;background:#f4f5f7;font-size:15px;line-height:1.5}
header{background:#1f3a5f;color:#fff;padding:12px 16px}
header h1{font-size:20px;margin:0}header .d{font-size:14px;opacity:.9}
header a{color:#fff}
.warn{background:#fdecea;color:#a50e0e;border-bottom:2px solid #a50e0e;padding:8px 16px;font-weight:bold}
main{padding:12px 16px 60px;max-width:1500px;margin:0 auto}
nav.top{margin:0 0 6px;font-size:14px}nav.top a{margin-right:12px}
h2{font-size:18px;margin:22px 0 6px;border-left:6px solid #1f3a5f;padding-left:8px}
h2 small{font-weight:normal;color:#555;font-size:13px}
.note{color:#555;font-size:13px;margin:4px 0}
.tools{position:sticky;top:0;background:#f4f5f7;padding:8px 0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid #ddd}
.tools input[type=search]{flex:1 1 200px;min-width:160px;font-size:15px;padding:6px 8px;border:1px solid #aab;border-radius:4px}
.tools button,.tabs button{font-size:14px;padding:6px 12px;border:1px solid #1f3a5f;background:#fff;color:#1f3a5f;border-radius:4px;cursor:pointer}
.tools button.on,.tabs button.on{background:#1f3a5f;color:#fff}
.tabs{margin:10px 0}
table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}
th,td{border:1px solid #d5d8de;padding:5px 6px;vertical-align:top;text-align:left}
th{background:#1f3a5f;color:#fff;white-space:nowrap;position:sticky;top:48px}
td.n{text-align:right;white-space:nowrap}
table.sum{width:auto;margin:6px 0}table.sum td{text-align:right;min-width:44px}table.sum td:first-child{text-align:left}
table.sum th{position:static}
tr.new td{background:#fff6d5}tr.drop td.price{color:#b00020;font-weight:bold}
.g{display:inline-block;min-width:24px;text-align:center;font-weight:bold;border-radius:3px;color:#fff;padding:0 4px}
.gA{background:#2e7d32}.gB{background:#e0a100}.gC{background:#c62828}.g-{background:#9e9e9e}
.tag{display:inline-block;font-size:12px;border-radius:3px;padding:0 5px;margin:1px 2px 1px 0;background:#eef;border:1px solid #99c;white-space:nowrap}
.tag.t-new{background:#fff2cc;border-color:#e0c060}.tag.t-drop{background:#fde0e0;border-color:#d88}.tag.t-rel{background:#e6e6f5;border-color:#9a9ac8}
details.relist{margin:10px 0;border-left:6px solid #9a9ac8;padding-left:8px}details.relist>summary{cursor:pointer;font-weight:bold}
.srcwhy{color:#a50e0e;font-size:12px}
.est{color:#888;font-size:12px}.gid{color:#888;font-size:11px;word-break:break-all}
a.tel{font-weight:bold;white-space:nowrap}
.empty{color:#888;margin:4px 0 0 4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.cards a.card{display:block;background:#fff;border:1px solid #cdd3dc;border-radius:8px;padding:14px;text-decoration:none;color:#1d2330}
.cards a.card b{font-size:18px;color:#1f3a5f}.cards a.card span{display:block;color:#555;font-size:14px;margin-top:4px}
footer{color:#888;font-size:12px;padding:16px}
@media (max-width:760px){
 body{font-size:15px}main{padding:8px 8px 60px}
 table.list,table.list tbody,table.list tr,table.list td{display:block;width:100%}
 table.list tr.head{display:none}
 table.list tr{background:#fff;border:1px solid #cdd3dc;border-radius:8px;margin:0 0 10px;padding:6px 8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
 table.list td{border:none;border-bottom:1px dotted #e3e6ea;padding:4px 0;display:flex;gap:8px;text-align:left}
 table.list td:last-child{border-bottom:none}
 table.list td::before{content:attr(data-label);flex:0 0 6.2em;color:#667;font-size:13px}
 table.list td:empty,table.list td.blank{display:none}
 td.n{text-align:left}
 .tools{top:0}
}
@media print{body{display:none}}
:root{--navoff:64px}

.nvbar{margin:10px 0;padding:8px 10px;background:#fff8e1;border:1px solid #e0c060;border-radius:6px}
.nvh{font-size:15px;margin-bottom:6px}
.nvchips{display:flex;flex-wrap:wrap;gap:8px}
a.nv{display:inline-block;padding:8px 12px;min-height:40px;line-height:24px;font-size:16px;background:#fff;color:#1f3a5f;border:1px solid #1f3a5f;border-radius:20px;text-decoration:none}
a.nv b{color:#c62828}a.nv sup{color:#888}
a.nv:hover,a.nv:active{background:#1f3a5f;color:#fff}a.nv:hover b,a.nv:active b{color:#ffd54f}
.nvempty{font-size:16px;color:#555;padding:4px 0}
.nvnote{font-size:12px;color:#666;margin-top:6px}
details.grp{scroll-margin-top:var(--navoff,12px);border-radius:4px}
details.grp>summary{list-style:none;cursor:pointer}details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary h2{display:inline-block;margin-right:10px}
details.grp>summary::before{content:"\25BC ";color:#667;font-size:12px}details.grp:not([open])>summary::before{content:"\25B6 "}
a.up{font-size:14px;padding:4px 8px;display:inline-block;color:#1f3a5f}
details.grp.flash{background:#fff3b0;outline:3px solid #e0a100;transition:background .4s}
@media (max-width:760px){a.nv{font-size:17px;padding:10px 14px;min-height:44px}a.up{padding:8px 10px;font-size:15px}}
</style></head><body>
<header id="top"><h1>同仁版物件報表</h1><div class="d">資料日期：—</div></header>
<div class="warn">內含個資，請勿外傳或截圖轉貼</div>

</main>
<footer>同仁版物件報表｜僅供公司同仁內部使用｜內含個資，請勿外傳或截圖轉貼</footer>

</body></html>
